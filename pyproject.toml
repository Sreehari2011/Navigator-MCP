[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navigator-mcp"
version = "2.0.0"
description = "Navigator — the pathfinding browser MCP. Token-efficient perception, stealth, captcha solving and traffic inspection for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Navigator MCP" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "browser-automation",
    "playwright",
    "llm",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastmcp>=2.12.0",
    "playwright>=1.45.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
navigator-mcp = "navigator_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["navigator_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: requires a Playwright browser binary (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# S110/S112 (try-except-pass/continue): intentional defensive event-handler pattern
ignore = ["S110", "S112", "RUF012", "RUF059"]

[tool.ruff.lint.per-file-ignores]
# files embedding long JS payloads keep their natural formatting
"navigator_mcp/captcha/detector.py" = ["E501"]
"navigator_mcp/stealth/init_scripts.py" = ["E501"]
"navigator_mcp/perception/snapshot.py" = ["E501"]
"navigator_mcp/perception/extraction.py" = ["E501"]
